spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: j4mb-ledger
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/j4mb_ledger}
    username: ${SPRING_DATASOURCE_USERNAME:j4mb}
    password: ${SPRING_DATASOURCE_PASSWORD:j4mb123}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Explicit dialect — Hibernate 6 auto-detects but explicit is safer across versions.
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    # Platform-only migrations run automatically at startup.
    # Tenant schema migrations (db/migration/tenant/) are run programmatically
    # by TenantMigrator during tenant provisioning — one run per new tenant schema.
    locations: classpath:db/migration/platform
  docker:
    compose:
      enabled: false

server:
  port: ${SPRING_BOOT_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  group-configs:
    - group: internal
      paths-to-match: /internal/**
    - group: ledger
      paths-to-match: /api/**
